<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 700" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .board { fill:#0b3d0b; stroke:#333; stroke-width:2; }
      .blk   { fill:#1e6f1e; stroke:#cfe8cf; stroke-width:1.5; }
      .conn  { fill:#8a6d1a; stroke:#ffe08a; stroke-width:1.5; }
      .fix   { fill:#7a1f1f; stroke:#ff9d9d; stroke-width:2.5; }
      .keep  { fill:none; stroke:#ff9d9d; stroke-width:1; stroke-dasharray:4 4; }
      .quiet { fill:#14501e; stroke:#9fd7a9; stroke-width:1; stroke-dasharray:5 4; }
      .hole  { fill:#ddd; stroke:#666; stroke-width:1.5; }
      .lbl   { fill:#f0f0f0; font-size:13px; }
      .lbl2  { fill:#ffe9a8; font-size:12px; }
      .lblr  { fill:#ffc9c9; font-size:12px; }
      .dim   { fill:#bbb; font-size:12px; }
      .title { fill:#222; font-size:17px; font-weight:bold; }
      .note  { fill:#555; font-size:12px; }
      .cross { stroke:#fff; stroke-width:1.5; }
    </style>
  </defs>
  <rect x="0" y="0" width="990" height="700" fill="#f4f1e8"/>
  <text x="28" y="30" class="title">speccy board — floorplan v0.4 (measured: 211.5 x 130 mm; slots FLANK the board)</text>
  <text x="28" y="50" class="note">4 px/mm. Component side facing you, ports at top. Crosshairs = measured points (nearest contact to its edge).</text>

  <rect x="70" y="90" width="846" height="520" rx="6" class="board"/>
  <text x="420" y="630" class="dim">211.5 mm (measured)</text>
  <text x="16" y="380" class="dim" transform="rotate(-90 26 380)">130 mm (measured)</text>

  <!-- REAR EDGE -->
  <rect x="140" y="94" width="120" height="48" class="conn"/>
  <text x="146" y="114" class="lbl2">2x 3.5mm jacks</text>
  <text x="146" y="130" class="lbl2">line-out + EAR-in</text>
  <rect x="290" y="94" width="270" height="56" class="conn"/>
  <text x="298" y="114" class="lbl2">rear strip (re-printable panel):</text>
  <text x="298" y="130" class="lbl2">VGA DE-15 | 2x DE-9 | microSD | JTAG</text>
  <rect x="830" y="94" width="80" height="48" class="conn"/>
  <text x="834" y="114" class="lbl2">DC 5-12V</text>
  <text x="834" y="130" class="lbl2">barrel</text>
  <rect x="760" y="152" width="150" height="72" class="blk"/>
  <text x="768" y="172" class="lbl">POWER: wide-in buck</text>
  <text x="768" y="188" class="lbl">3.3V/2A + protection</text>
  <text x="768" y="204" class="lbl">(1982-PSU-proof)</text>
  <rect x="640" y="152" width="106" height="72" class="blk"/>
  <text x="648" y="172" class="lbl">DIP-4 modes</text>
  <text x="648" y="188" class="lbl">RESET + NMI</text>
  <text x="648" y="204" class="lbl">+ case-btn hdr</text>
  <rect x="76" y="152" width="130" height="80" class="quiet"/>
  <text x="84" y="172" class="lbl">analog corner:</text>
  <text x="84" y="188" class="lbl">audio RC, line drv,</text>
  <text x="84" y="204" class="lbl">EAR divider/schmitt</text>

  <!-- KEYBOARD SLOTS: measured, fixed -->
  <!-- 5-way: contacts from X=30 rightward ~25.4mm; slot drawn 30..64, centered on Y=57 from bottom -->
  <rect x="182" y="372" width="64" height="20" class="fix"/>
  <line x1="190" y1="368" x2="190" y2="396" class="cross"/>
  <text x="78" y="416" class="lblr">KB1 5-way (contacts face UP): leftmost contact</text>
  <text x="78" y="432" class="lblr">30 fr left edge, 57 fr bottom</text>
  <!-- 8-way: contacts from X=184.5 leftward ~44.5mm; slot drawn 134..186.5, centered on Y=64 from bottom -->
  <rect x="726" y="344" width="92" height="20" class="fix"/>
  <line x1="808.0" y1="340" x2="808.0" y2="368" class="cross"/>
  <text x="606" y="334" class="lblr">KB2 8-way (contacts face DOWN): rightmost contact 27 fr right, 64 fr bottom</text>
  <rect x="170" y="358" width="88" height="52" class="keep"/>
  <rect x="714" y="330" width="116" height="52" class="keep"/>
  <text x="166" y="452" class="lblr">keep-outs: tails drop in from above. Pitch ~2.5mm (photo-measured): CONFIRM 2.54 vs 2.50 by span.</text>

  <!-- DIGITAL CORE in the corridor between the slots -->
  <rect x="358" y="298" width="100" height="100" class="blk"/>
  <text x="362" y="330" class="lbl">10M50SAE144</text>
  <text x="362" y="346" class="lbl">22x22 EQFP</text>
  <rect x="470" y="314" width="92" height="44" class="blk"/>
  <text x="474" y="342" class="lbl">SDRAM</text>
  <rect x="470" y="374" width="56" height="32" class="blk"/>
  <text x="474" y="396.0" class="lbl">50MHz</text>
  <text x="358" y="274" class="note" fill="#9fd7a9">the corridor the slots leave free</text>

  <!-- VGA ladder near rear strip -->
  <rect x="390" y="198" width="140" height="40" class="blk"/>
  <text x="394" y="226" class="lbl">VGA DAC ladder</text>

  <!-- Sinclair taps near KB2 -->
  <rect x="630" y="450" width="168" height="36" class="blk"/>
  <text x="634" y="474" class="lbl">Sinclair joy taps -> rear DE-9</text>

  <!-- silkscreen -->
  <rect x="102" y="474" width="220" height="104" class="quiet"/>
  <text x="110" y="506" class="lbl">silkscreen: build log,</text>
  <text x="110" y="526" class="lbl">(c) 2026</text>

  <!-- mounting holes: MEASURED -->
  <!-- centre board-holding hole: dia 2mm, X centre (assumed 105.75 - confirm), 40mm from bottom -->
  <circle cx="493" cy="450" r="4" class="hole"/>
  <circle cx="493" cy="450" r="12" class="keep"/>
  <text x="505" y="446" class="lbl">hole 2mm dia: board mount,</text>
  <text x="505" y="462" class="lbl">centre(?), 40 fr bottom -- MEASURED</text>
  <!-- top pass-through for case bolt: dia 3mm, 5mm from top edge -->
  <circle cx="493" cy="110" r="6" class="hole"/>
  <circle cx="493" cy="110" r="14" class="keep"/>
  <text x="505" y="106" class="lbl">hole 3mm dia: case bolt pass-through,</text>
  <text x="505" y="122" class="lbl">centre(?), 5 fr top -- MEASURED</text>
  <!-- corner holes: top pair photo-derived inset; bottom pair unconfirmed -->
  <circle cx="118" cy="114" r="6" class="hole"/>
  <text x="130" y="134" class="lbl">~(12, 6) photo</text>
  <circle cx="860" cy="116" r="6" class="hole"/>
  <text x="700" y="140" class="lbl">~(197.5, 6.5) photo</text>
  <circle cx="118" cy="586" r="6" class="keep"/>
  <circle cx="860" cy="586" r="6" class="keep"/>
  <text x="70" y="668" class="note">Solid = measured/photo-read (2mm mount @ centre,40 fr bottom; 3mm bolt @ centre,5 fr top; top corners inset per photos). Dashed bottom corners: exist? Give ruler readings per hole to freeze. Slot Y assumed contact-row centreline.</text>
</svg>