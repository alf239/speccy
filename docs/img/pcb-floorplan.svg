<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica,Arial,sans-serif">
  <defs><style>
      .board { fill:#0b3d0b; stroke:#333; stroke-width:2; }
      .blk   { fill:#1e6f1e; stroke:#cfe8cf; stroke-width:1.5; }
      .conn  { fill:#8a6d1a; stroke:#ffe08a; stroke-width:1.5; }
      .fix   { fill:#7a1f1f; stroke:#ff9d9d; stroke-width:2.5; }
      .keep  { fill:none; stroke:#ff9d9d; stroke-width:1; stroke-dasharray:4 4; }
      .quiet { fill:#14501e; stroke:#9fd7a9; stroke-width:1; stroke-dasharray:5 4; }
      .hole  { fill:#ddd; stroke:#666; stroke-width:1.5; }
      .lbl   { fill:#f0f0f0; font-size:13px; }
      .lbl2  { fill:#ffe9a8; font-size:12px; }
      .lblr  { fill:#ffc9c9; font-size:12px; }
      .dim   { fill:#bbb; font-size:12px; }
      .title { fill:#222; font-size:17px; font-weight:bold; }
      .note  { fill:#555; font-size:12px; }
      .cross { stroke:#fff; stroke-width:1.5; }
  </style></defs>
  <rect x="0" y="0" width="1000" height="700" fill="#f4f1e8"/>
  <text x="28" y="30" class="title">speccy board — floorplan (generated; outline 213.5 x 130.0 mm)</text>
  <text x="28" y="50" class="note">4 px/mm. Component side facing you, ports at top. Regenerate: python3 tools/gen_pcb_sketch.py</text>
  <rect x="70" y="90" width="854" height="520" rx="6" class="board"/>
  <text x="420" y="634" class="dim">213.5 mm (measured)</text>
  <text x="16" y="380" class="dim" transform="rotate(-90 26 380)">130.0 mm (measured)</text>
  <rect x="140" y="92" width="120" height="48" class="conn"/>
  <text x="148" y="112" class="lbl2">2x 3.5mm jacks</text>
  <text x="148" y="128" class="lbl2">line-out + EAR-in</text>
  <rect x="290" y="92" width="188" height="56" class="conn"/>
  <text x="298" y="112" class="lbl2">rear strip A:</text>
  <text x="298" y="128" class="lbl2">VGA | microSD</text>
  <rect x="516" y="92" width="148" height="56" class="conn"/>
  <text x="524" y="112" class="lbl2">rear strip B:</text>
  <text x="524" y="128" class="lbl2">2x DE-9 | JTAG</text>
  <rect x="830" y="92" width="80" height="48" class="conn"/>
  <text x="838" y="112" class="lbl2">DC 5-12V</text>
  <text x="838" y="128" class="lbl2">barrel</text>
  <rect x="764" y="152" width="148" height="72" class="blk"/>
  <text x="772" y="172" class="lbl">POWER: wide-in buck</text>
  <text x="772" y="188" class="lbl">3.3V/2A + protection</text>
  <text x="772" y="204" class="lbl">(1982-PSU-proof)</text>
  <rect x="672" y="152" width="84" height="72" class="blk"/>
  <text x="680" y="172" class="lbl">DIP-4 modes</text>
  <text x="680" y="188" class="lbl">RESET + NMI</text>
  <text x="680" y="204" class="lbl">case-btn hdr</text>
  <rect x="76" y="152" width="128" height="80" class="quiet"/>
  <text x="84" y="172" class="lbl">analog corner:</text>
  <text x="84" y="188" class="lbl">audio RC, line drv,</text>
  <text x="84" y="204" class="lbl">EAR divider/schmitt</text>
  <rect x="358" y="398" width="100" height="100" class="blk"/>
  <text x="366" y="418" class="lbl">10M50SAE144</text>
  <text x="366" y="434" class="lbl">22x22 EQFP</text>
  <rect x="470" y="358" width="92" height="44" class="blk"/>
  <text x="478" y="378" class="lbl">SDRAM TSOP-54</text>
  <rect x="294" y="346" width="56" height="32" class="blk"/>
  <text x="302" y="366" class="lbl">50MHz</text>
  <rect x="390" y="240" width="140" height="40" class="blk"/>
  <text x="398" y="260" class="lbl">VGA DAC ladder</text>
  <rect x="630" y="486" width="168" height="36" class="blk"/>
  <text x="638" y="506" class="lbl">Sinclair joy taps -> rear DE-9</text>
  <rect x="102" y="514" width="220" height="80" class="quiet"/>
  <text x="110" y="534" class="lbl">silkscreen: build log, (c) 2026</text>
  <rect x="358" y="538" width="200" height="36" class="quiet"/>
  <text x="366" y="558" class="lbl">decoupling farm everywhere</text>
  <circle cx="838" cy="560" r="20" class="hole"/>
  <text x="698" y="534" class="lbl">speaker hole ~10.0mm + driver PHOTO-EST</text>
  <rect x="178" y="376" width="65" height="20" class="fix"/>
  <line x1="190" y1="372" x2="190" y2="400" class="cross"/>
  <rect x="166" y="362" width="89" height="52" class="keep"/>
  <rect x="733" y="344" width="95" height="20" class="fix"/>
  <line x1="816" y1="340" x2="816" y2="368" class="cross"/>
  <rect x="721" y="330" width="119" height="52" class="keep"/>
  <text x="150" y="420" class="lblr">KB1 5-way (contacts UP): leftmost contact 30 fr left, 56 fr bottom</text>
  <text x="550" y="324" class="lblr">KB2 8-way (contacts DOWN): rightmost 27 fr right, 64 fr bottom</text>
  <circle cx="90" cy="268" r="8" class="hole"/>
  <circle cx="90" cy="268" r="18" class="keep"/>
  <circle cx="904" cy="268" r="8" class="hole"/>
  <circle cx="904" cy="268" r="18" class="keep"/>
  <circle cx="89" cy="591" r="8" class="hole"/>
  <circle cx="89" cy="591" r="18" class="keep"/>
  <circle cx="905" cy="591" r="8" class="hole"/>
  <circle cx="905" cy="591" r="18" class="keep"/>
  <circle cx="497" cy="450" r="4" class="hole"/>
  <circle cx="497" cy="450" r="14" class="keep"/>
  <circle cx="497" cy="110" r="6" class="hole"/>
  <circle cx="497" cy="110" r="16" class="keep"/>
  <circle cx="118" cy="114" r="7" class="keep"/>
  <circle cx="868" cy="116" r="7" class="keep"/>

  <text x="70" y="676" class="note">Red = fixed (measured). Dashed = keep-out / legacy. Speaker hole and centre-pair X photo/assumed: confirm. Pitch 2.54 pending tiebreak.</text>
</svg>